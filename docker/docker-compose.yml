name: go2-rl
services:
  unitree-rl:
    image: go2-rl:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    platform: linux/amd64
    # Retain compatibility with existing GO2_MJLAB_CONTAINER launchers.
    container_name: unitree-rl-mjlab
    hostname: go2-rl
    network_mode: host
    runtime: nvidia
    gpus: all
    shm_size: 8gb
    stdin_open: true
    tty: true
    working_dir: /workspace/unitree_rl_mjlab
    volumes:
      - ../:/workspace/unitree_rl_mjlab:rw
    environment:
      ROS_DOMAIN_ID: "42"
      MUJOCO_GL: egl
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    command: bash
